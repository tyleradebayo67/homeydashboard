<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Homey — Daily Reports</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0f172a; --surface:#1e293b; --surface2:#263146; --border:#334155;
  --text:#f1f5f9; --muted:#94a3b8; --accent:#6366f1;
}
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:14px; line-height:1.6; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }

.nav { background:var(--surface); border-bottom:1px solid var(--border); padding:14px 32px; display:flex; align-items:center; gap:24px; }
.nav-brand { font-size:1.1rem; font-weight:700; }
.nav-brand span { color:var(--accent); }
.nav-link { color:var(--muted); font-size:0.85rem; font-weight:500; padding:4px 10px; border-radius:6px; transition:background .15s; }
.nav-link:hover, .nav-link.active { background:var(--surface2); color:var(--text); text-decoration:none; }

.main { max-width:900px; margin:0 auto; padding:32px; }
.page-title { font-size:1.3rem; font-weight:700; margin-bottom:6px; }
.page-sub { color:var(--muted); font-size:0.85rem; margin-bottom:28px; }

.rpt-table-wrap { border:1px solid var(--border); border-radius:12px; overflow:hidden; }
table { width:100%; border-collapse:collapse; background:var(--surface); }
thead th { background:var(--surface2); color:var(--muted); font-size:0.72rem; font-weight:600;
            text-transform:uppercase; letter-spacing:.05em; padding:10px 18px; text-align:left; }
.rpt-row { border-top:1px solid var(--border); cursor:pointer; transition:background .15s; }
.rpt-row:hover { background:var(--surface2); }
.rpt-date { width:120px; padding:14px 18px; white-space:nowrap; }
.rpt-dow { font-size:0.72rem; color:var(--muted); }
.rpt-ds { font-weight:600; font-size:0.88rem; }
.rpt-title { font-weight:600; font-size:0.9rem; margin-bottom:3px; }
.rpt-pick { font-size:0.78rem; color:var(--accent); margin-bottom:3px; }
.rpt-macro { font-size:0.75rem; color:var(--muted); }
td { padding:12px 18px; vertical-align:top; }
.rpt-arrow { width:30px; text-align:center; color:var(--muted); font-size:1.2rem; vertical-align:middle; }

.rpt-panel { display:none; }
.rpt-panel.visible { display:block; }
.rpt-panel-header { display:flex; align-items:center; justify-content:space-between;
                     margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border); }
.back-btn { background:var(--surface2); border:1px solid var(--border); color:var(--text);
             padding:7px 14px; border-radius:8px; cursor:pointer; font-size:0.85rem; }
.back-btn:hover { background:var(--border); }
.rpt-panel-date { color:var(--muted); font-size:0.85rem; }
.rpt-panel-body { max-width:720px; }
.rpt-panel-body h2 { font-size:1.15rem; margin:20px 0 8px; color:var(--text); }
.rpt-panel-body h3 { font-size:1rem; margin:18px 0 6px; color:var(--text); }
.rpt-panel-body h4 { font-size:0.9rem; margin:14px 0 4px; color:var(--muted); }
.rpt-panel-body p { color:var(--muted); margin-bottom:6px; }
.rpt-panel-body ul { padding-left:20px; margin-bottom:10px; }
.rpt-panel-body li { color:var(--muted); margin-bottom:4px; line-height:1.55; }
.rpt-panel-body strong { color:var(--text); }
.rpt-panel-body em { color:#a5b4fc; }
.rpt-panel-body code { background:var(--surface2); border-radius:4px; padding:1px 5px; font-size:0.85em; color:#34d399; }
.rpt-panel-body hr { border:none; border-top:1px solid var(--border); margin:20px 0; }
.rpt-panel-body a { color:var(--accent); }
.rpt-panel-body br { display:block; margin:4px 0; content:''; }

#rpt-index { display:block; }

@media (max-width:600px) {
  .main { padding:16px; }
  .nav { padding:12px 16px; gap:14px; }
  .rpt-date { display:none; }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">&#127968; <span>Homey</span></div>
  <a href="index.html" class="nav-link">Dashboard</a>
  <a href="reports.html" class="nav-link active">Reports</a>
</nav>

<div class="main">
  <div id="rpt-index">
    <div class="page-title">Daily Reports</div>
    <div class="page-sub" id="reports-sub">Loading...</div>
    <div class="rpt-table-wrap">
      <table>
        <thead>
          <tr><th>Date</th><th>Report</th><th></th></tr>
        </thead>
        <tbody id="rpt-table-body">
          <tr><td colspan="3" style="text-align:center;padding:32px;color:var(--muted)">Loading reports...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="rpt-panels-container"></div>
</div>

<script>
function openReport(slug) {
  document.getElementById('rpt-index').style.display = 'none';
  document.querySelectorAll('.rpt-panel').forEach(function(p) { p.classList.remove('visible'); });
  var panel = document.getElementById('panel-' + slug);
  if (panel) {
    panel.classList.add('visible');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function closeReport() {
  document.querySelectorAll('.rpt-panel').forEach(function(p) { p.classList.remove('visible'); });
  document.getElementById('rpt-index').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderReports(reports) {
  document.getElementById('reports-sub').textContent = reports.length + ' reports';

  var tbody = document.getElementById('rpt-table-body');
  var rowsHtml = '';
  reports.forEach(function(r) {
    rowsHtml += '<tr class="rpt-row" data-slug="' + r.slug + '" onclick="openReport(\'' + r.slug + '\')">'
      + '<td class="rpt-date">'
      + '<div class="rpt-dow">' + (r.day_of_week || '') + '</div>'
      + '<div class="rpt-ds">' + (r.display_date || r.date) + '</div>'
      + '</td><td>'
      + '<div class="rpt-title">' + (r.title || 'Report ' + r.date) + '</div>'
      + (r.pick_preview ? '<div class="rpt-pick">' + r.pick_preview + '</div>' : '')
      + (r.macro_preview ? '<div class="rpt-macro">' + r.macro_preview + '</div>' : '')
      + '</td>'
      + '<td class="rpt-arrow">&#8250;</td></tr>';
  });
  tbody.innerHTML = rowsHtml;

  var panelsContainer = document.getElementById('rpt-panels-container');
  var panelsHtml = '';
  reports.forEach(function(r) {
    panelsHtml += '<div class="rpt-panel" id="panel-' + r.slug + '">'
      + '<div class="rpt-panel-header">'
      + '<button class="back-btn" onclick="closeReport()">&#8592; Back to all reports</button>'
      + '<div class="rpt-panel-date">' + (r.day_of_week ? r.day_of_week + ', ' : '') + (r.display_date || r.date) + '</div>'
      + '</div>'
      + '<div class="rpt-panel-body">' + (r.body_html || '<p>No content available.</p>') + '</div>'
      + '</div>';
  });
  panelsContainer.innerHTML = panelsHtml;

  var params = new URLSearchParams(window.location.search);
  var deepLink = params.get('report');
  if (deepLink) openReport(deepLink);
}

fetch('data/reports.json')
  .then(function(r) {
    if (!r.ok) throw new Error('Failed to load reports');
    return r.json();
  })
  .then(function(data) {
    renderReports(data);
  })
  .catch(function(err) {
    document.getElementById('rpt-table-body').innerHTML =
      '<tr><td colspan="3" style="text-align:center;color:#ef4444;padding:32px">Error: ' + err.message + '</td></tr>';
  });
</script>
</body>
</html>
